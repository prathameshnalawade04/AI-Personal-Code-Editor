<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Code Workspace</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CodeMirror for Python Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    
    <!-- Marked.js for parsing Gemini's Markdown response -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#1a1a24',
                        panelDark: '#252533',
                        accentGreen: '#23a559',
                        accentBlue: '#3b82f6',
                        accentPink: '#ec4899'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a24; }
        ::-webkit-scrollbar-thumb { background: #3f3f5a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f4f7a; }

        /* CodeMirror overrides to match theme */
        .CodeMirror {
            height: 100%;
            background-color: transparent !important;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            padding: 10px 0;
        }
        
        /* Markdown rendering styles */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #fff; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; }
        .markdown-body h1 { font-size: 1.5rem; }
        .markdown-body h2 { font-size: 1.25rem; }
        .markdown-body p { margin-bottom: 1rem; line-height: 1.6; color: #d1d5db; }
        .markdown-body pre { background-color: #1a1a24; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #3f3f5a; }
        .markdown-body code { font-family: 'Fira Code', monospace; color: #a78bfa; background: rgba(167, 139, 250, 0.1); padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
        .markdown-body pre code { color: #e5e7eb; background: transparent; padding: 0; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; color: #d1d5db; }
        
        /* Blink animation for loading states */
        @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .loading-blink { animation: blink 1.5s infinite; }
    </style>
</head>

<body class="bg-bgDark text-gray-300 h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation / Header -->
    <header class="bg-panelDark border-b border-gray-700/50 p-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-laptop-code text-accentBlue text-2xl"></i>
            <h1 class="text-xl font-bold text-white tracking-wide">AI Personal Code Workspace</h1>
            <span class="bg-blue-900/50 text-blue-300 text-xs font-semibold px-2 py-1 rounded-full border border-blue-700/50">
                GEMINI 2.5 INSIDE
            </span>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex gap-3">
            <button id="btn-run" class="bg-accentGreen hover:bg-green-600 text-white px-4 py-2 rounded-md font-medium transition-colors flex items-center gap-2 shadow-lg shadow-green-900/20">
                <i class="fa-solid fa-play"></i> Run Code
            </button>
            <button id="btn-refactor" class="bg-accentBlue hover:bg-blue-600 text-white px-4 py-2 rounded-md font-medium transition-colors flex items-center gap-2 shadow-lg shadow-blue-900/20">
                <i class="fa-solid fa-wand-magic-sparkles"></i> AI Refactor
            </button>
            <button id="btn-explain" class="bg-panelDark hover:bg-gray-700 border border-gray-600 text-white px-4 py-2 rounded-md font-medium transition-colors flex items-center gap-2">
                <i class="fa-solid fa-brain text-accentPink"></i> AI Explain
            </button>
        </div>
    </header>

    <main class="flex-1 p-4 flex gap-4 h-[calc(100vh-73px)]">
        
        <!-- Left Panel: Python Code Editor -->
        <div class="w-1/2 flex flex-col bg-panelDark rounded-lg border border-gray-700/50 shadow-xl overflow-hidden">
            <div class="flex justify-between items-center p-3 border-b border-gray-700/50 bg-[#1e1e2e]">
                <h2 class="text-sm font-semibold text-gray-400 flex items-center gap-2">
                    <i class="fa-brands fa-python text-yellow-500"></i> Python Code Workspace
                </h2>
                <span class="text-xs bg-gray-700 px-2 py-1 rounded text-gray-300 font-mono">main.py</span>
            </div>
            <div class="flex-1 relative">
                <textarea id="code-editor">
# Paste your Python code here ...
def process_data(limit):
    results = []
    for i in range(limit):
        if i % 2 == 0:
            results.append(i * i)
    return results

print("Results Matrix:", process_data(10))
</textarea>
            </div>
        </div>

        <!-- Right Panel: Outputs -->
        <div class="w-1/2 flex flex-col gap-4">
            
            <!-- Top Right: Terminal Output -->
            <div class="flex-1 flex flex-col bg-panelDark rounded-lg border border-gray-700/50 shadow-xl overflow-hidden">
                <div class="flex justify-between items-center p-3 border-b border-gray-700/50 bg-[#1e1e2e]">
                    <h2 class="text-sm font-semibold text-gray-400 flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-green-500"></div> Terminal Output
                    </h2>
                    <span class="text-xs text-gray-500 font-mono">stdout/stderr</span>
                </div>
                <div class="flex-1 p-4 overflow-y-auto bg-[#0d0d12]">
                    <pre id="terminal-output" class="font-mono text-green-400 text-sm whitespace-pre-wrap tracking-tight">System initialized. Ready for execution.</pre>
                </div>
            </div>

            <!-- Bottom Right: Gemini AI Analysis -->
            <div class="flex-1 flex flex-col bg-panelDark rounded-lg border border-gray-700/50 shadow-xl border-t-2 border-t-accentBlue overflow-hidden">
                <div class="flex justify-between items-center p-3 border-b border-gray-700/50 bg-[#1e1e2e]">
                    <h2 class="text-sm font-semibold text-gray-400 flex items-center gap-2">
                        <i class="fa-solid fa-sparkles text-accentBlue"></i> Gemini Assistant Analysis
                    </h2>
                    <span class="text-xs border border-blue-500/50 text-blue-400 px-2 py-0.5 rounded font-semibold bg-blue-900/20">Markdown Enabled</span>
                </div>
                <div id="ai-output" class="flex-1 p-4 overflow-y-auto markdown-body text-sm">
                    <p class="text-gray-500 italic">Click 'AI Refactor' or 'AI Explain' to analyze your code.</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        // 1. Initialize CodeMirror Editor
        const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            mode: "python",
            theme: "dracula",
            lineNumbers: true,
            indentUnit: 4,
            matchBrackets: true,
            autoCloseBrackets: true
        });

        // 2. DOM Elements
        const terminalOutput = document.getElementById('terminal-output');
        const aiOutput = document.getElementById('ai-output');
        const btnRun = document.getElementById('btn-run');
        const btnRefactor = document.getElementById('btn-refactor');
        const btnExplain = document.getElementById('btn-explain');

        // 3. Setup WebSocket Connection
        // It connects dynamically to your Django Channels route. 
        // Note: If you run this file directly in a browser (file://), it defaults to localhost:8000
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsHost = window.location.host || '127.0.0.1:8000';
        let chatSocket;

        function connectWebSocket() {
            try {
                chatSocket = new WebSocket(`${wsProtocol}${wsHost}/ws/execute/`);

                chatSocket.onopen = function() {
                    console.log("🚀 WebSocket Connected to Django Backend!");
                    terminalOutput.innerHTML += '\n<span class="text-gray-500">[System]: WebSocket connected.</span>';
                };

                chatSocket.onmessage = function(e) {
                    const data = JSON.parse(e.data);
                    
                    // Handle Standard Code Execution Output
                    if (data.type === 'stdout') {
                        terminalOutput.innerText = data.output;
                    } 
                    // Handle Gemini AI Output
                    else if (data.type === 'ai_response') {
                        // Using marked.js to convert markdown string to beautiful HTML
                        aiOutput.innerHTML = marked.parse(data.output);
                    }
                };

                chatSocket.onclose = function(e) {
                    console.error('🛑 WebSocket closed unexpectedly. Reconnecting in 3s...');
                    terminalOutput.innerHTML += '\n<span class="text-red-500">[System]: Connection lost.</span>';
                    setTimeout(connectWebSocket, 3000);
                };
            } catch (err) {
                console.error("WebSocket connection failed:", err);
            }
        }

        // Initialize the connection
        connectWebSocket();

        // 4. Helper function to send data to the backend
        function sendActionPayload(actionType) {
            const currentCode = editor.getValue();
            
            // Validate code is not empty
            if (!currentCode.trim()) {
                terminalOutput.innerText = "Error: Cannot execute empty code.";
                return;
            }

            // Set Loading States based on action
            if (actionType === 'run') {
                terminalOutput.innerHTML = '<span class="text-gray-400 loading-blink">Executing Python code...</span>';
            } else if (actionType === 'refactor') {
                aiOutput.innerHTML = `
                    <div class="flex flex-col gap-2 loading-blink text-blue-400">
                        <p class="font-bold text-lg"><i class="fa-solid fa-hourglass-half"></i> AI Optimizing</p>
                        <p class="text-sm">Gemini is scanning code loops for inefficiencies and constructing refactored versions...</p>
                    </div>`;
            } else if (actionType === 'explain') {
                aiOutput.innerHTML = `
                    <div class="flex flex-col gap-2 loading-blink text-pink-400">
                        <p class="font-bold text-lg"><i class="fa-solid fa-brain"></i> AI Analyzing</p>
                        <p class="text-sm">Gemini is breaking down your logic step-by-step...</p>
                    </div>`;
            }

            // Ensure WebSocket is open before sending
            if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({
                    'action': actionType,
                    'code': currentCode
                }));
            } else {
                terminalOutput.innerText = "Error: Backend connection is offline. Please start your Django server.";
            }
        }

        // 5. Button Event Listeners
        btnRun.addEventListener('click', () => sendActionPayload('run'));
        btnRefactor.addEventListener('click', () => sendActionPayload('refactor'));
        btnExplain.addEventListener('click', () => sendActionPayload('explain'));

    </script>
</body>
</html>
