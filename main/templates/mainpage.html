<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Code Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #editor-container { height: 70vh; border: 1px solid #ddd; }
        #terminal { 
            height: 20vh; 
            background: #1e1e1e; 
            color: #00ff00; 
            padding: 15px; 
            font-family: 'Courier New', monospace;
            overflow-y: auto;
            border-radius: 5px;
        }
        .controls { padding: 10px 0; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-3">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold">AI Personal Editor</h4>
                <div>
                    <button id="run-btn" class="btn btn-success me-2">▶ Run Code</button>
                    <button id="ai-btn" class="btn btn-primary">✨ AI Compact</button>
                </div>
            </div>

            <div id="editor-container"></div>

            <div class="mt-3">
                <h6>Terminal Output</h6>
                <div id="terminal">Welcome. Click 'Run' to see output...</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>

<script>
    let editor;

    // 1. Initialize Monaco Editor
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
            value: "print('Hello, Django Channels!')",
            language: 'python',
            theme: 'vs-dark'
        });
    });

    // 2. Setup WebSocket Connection
    // Hint: Ensure your routing.py matches this URL path
    const socket = new WebSocket('ws://' + window.location.host + '/ws/execute/');
    socket.onopen=function(event){
        console.log('connected....')
    }

    socket.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        if (data.type === 'stdout') {
            document.getElementById('terminal').innerText = data.output;
        } else if (data.type === 'ai_code') {
            // Hint: This replaces the editor content with AI response
            editor.setValue(data.code);
        }
    };

    // 3. Handle Button Clicks
    document.getElementById('run-btn').onclick = function() {
        const code = editor.getValue();
        socket.send(JSON.stringify({
            'action': 'run',
            'code': code
        }));
        document.getElementById('terminal').innerText = "Running...";
    };

    document.getElementById('ai-btn').onclick = function() {
        const code = editor.getValue();
        socket.send(JSON.stringify({
            'action': 'refactor',
            'code': code
        }));
        document.getElementById('terminal').innerText = "AI is thinking...";
    };
</script>
</body>
</html>
